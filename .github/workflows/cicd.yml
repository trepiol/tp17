name: CI/CD Pipeline — TP16 Trivy Security Gate

on:
  push:
    branches: [main, develop, 'feature/**', 'test/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: tp16-notes-backend
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: v0.74.0

jobs:
  legacy-lint:
    name: Lint histórico TP06
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 yamllint
      - name: Lint Python legado si está presente
        shell: bash
        run: |
          if [[ -d devops-TP06/backend ]]; then
            flake8 devops-TP06/backend/ --max-line-length=100 --count --statistics
          else
            echo "Se omite el lint histórico: devops-TP06/backend no existe."
          fi

  test-integrated-app:
    name: Tests App Integrada TP12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devops-tp12/app/backend/requirements-dev.txt
      - run: pip install -r devops-tp12/app/backend/requirements-dev.txt
      - run: |
          flake8 devops-tp12/app/backend/app.py --max-line-length=100 --extend-ignore=E302,E701,E702,W391
          cd devops-tp12/app/backend
          pytest tests/ --cov=. --cov-report=term-missing -v

  build-and-package:
    name: Fase 1 — Build una vez y empaquetar
    runs-on: ubuntu-24.04
    needs: [test-integrated-app]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend integrado
        run: docker build --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" devops-tp12/app/backend
      - name: Guardar imagen para los jobs siguientes
        run: |
          mkdir -p dist
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o dist/backend-image.tar
          sha256sum dist/backend-image.tar > dist/backend-image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
          retention-days: 1
          compression-level: 0

  trivy-andon-cord:
    name: Fase 2A — Andon Cord Trivy
    runs-on: ubuntu-24.04
    needs: build-and-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - name: Verificar e importar imagen inmutable
        run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint del chart y renderizado de producción
        run: |
          helm lint devops-tp12/chart -f devops-tp12/values-prod.yaml
          helm template tp16 devops-tp12/chart -f devops-tp12/values-prod.yaml > manifests-rendered-prod.yaml
          python3 -c "import yaml; p='manifests-rendered-prod.yaml'; d=list(yaml.safe_load_all(open(p))); assert d and all(x is None or isinstance(x,dict) for x in d); print(f'YAML válido: {sum(x is not None for x in d)} documentos')"
      - name: Preparar inventario SCA de producción y desarrollo
        run: bash scripts/preparar-trivy-sca.sh
      - name: Trivy SCA HIGH/CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .trivy-sca
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          output: trivy-fs-blocking.txt
      - name: Trivy secretos en código backend
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: devops-tp12/app/backend
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          output: trivy-secrets-blocking.txt
      - name: Trivy Container HIGH/CRITICAL
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          output: trivy-image-blocking.txt
      - name: Trivy IaC HIGH/CRITICAL sobre YAML renderizado
        if: always() && hashFiles('manifests-rendered-prod.yaml') != ''
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: manifests-rendered-prod.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          output: trivy-config-blocking.txt
      - name: Resumen del Andon Cord
        if: always()
        shell: bash
        run: |
          {
            echo "### TP16 — Andon Cord Trivy"
            echo
            echo "Imagen: ${IMAGE_NAME}:${IMAGE_TAG} (artifact build-once)."
            echo "HIGH/CRITICAL bloquean SCA, imagen e IaC con exit code 1."
            echo "IaC: manifests-rendered-prod.yaml (Render First)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tp16-andon-evidence-${{ github.sha }}
          path: |
            trivy-fs-blocking.txt
            trivy-secrets-blocking.txt
            trivy-image-blocking.txt
            trivy-config-blocking.txt
            manifests-rendered-prod.yaml
          if-no-files-found: ignore
          retention-days: 7

  trivy-audit-report:
    name: Fase 2B — Auditoría Trivy LOW/MEDIUM
    runs-on: ubuntu-24.04
    needs: [build-and-package, trivy-andon-cord]
    if: ${{ always() && needs.build-and-package.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Renderizar manifiestos de producción
        run: helm template tp16 devops-tp12/chart -f devops-tp12/values-prod.yaml > manifests-rendered-prod.yaml
      - name: Preparar inventario SCA de producción y desarrollo
        run: bash scripts/preparar-trivy-sca.sh
      - name: Escaneo informativo SCA
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .trivy-sca
          scanners: vuln,secret
          severity: LOW,MEDIUM
          format: json
          output: trivy-fs-report.json
          exit-code: '0'
      - name: Reporte de secretos del backend
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: devops-tp12/app/backend
          scanners: secret
          format: json
          output: trivy-secrets-report.json
          exit-code: '0'
      - name: Escaneo informativo de imagen
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: LOW,MEDIUM
          format: json
          output: trivy-image-report.json
          exit-code: '0'
      - name: Escaneo informativo IaC
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: manifests-rendered-prod.yaml
          severity: LOW,MEDIUM
          format: json
          output: trivy-config-report.json
          exit-code: '0'
      - name: Resumen informativo
        if: always()
        run: |
          echo "### Reporte Trivy LOW/MEDIUM" >> "$GITHUB_STEP_SUMMARY"
          echo "Ver los resultados informativos en el artifact JSON." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tp16-trivy-audit-${{ github.sha }}
          path: |
            trivy-fs-report.json
            trivy-secrets-report.json
            trivy-image-report.json
            trivy-config-report.json
            manifests-rendered-prod.yaml
          if-no-files-found: ignore
          retention-days: 7

  gitleaks-andon-cord:
    name: TP17 — Andon Cord Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_CONFIG: .gitleaks.toml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos en los commits del evento
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # La Action limita push/PR al evento; este paso exige todo el historial.
      - name: Verificar también el historial completo
        shell: bash
        run: |
          set -euo pipefail
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          test -s "$GITLEAKS_CONFIG"
          gitleaks git . --config "$GITLEAKS_CONFIG" --redact=100 \
            --log-opts=--all --exit-code=1 --no-banner

      - name: Resumen seguro del Andon Gitleaks
        if: ${{ always() }}
        shell: bash
        env:
          TP17_ANDON_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### TP17 — Andon Cord Gitleaks"
            echo
            echo "Estado de los pasos previos: **${TP17_ANDON_STATUS}**."
            echo "Gitleaks: **${GITLEAKS_VERSION}**; configuración: .gitleaks.toml."
            echo "Un hallazgo no exceptuado o un error operativo bloquea publicación/deploy."
            echo "Este resumen no modifica el resultado bloqueante ni muestra secretos."
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks-audit-report:
    name: TP17 — Auditoría histórica Gitleaks
    runs-on: ubuntu-24.04
    needs: [gitleaks-andon-cord]
    if: ${{ always() }}
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_CONFIG: .gitleaks.toml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks CLI con versión y checksum verificados
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/tp17-gitleaks-cli"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/$checksums" -o "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          chmod 755 gitleaks
          test "$(./gitleaks version)" = "$GITLEAKS_VERSION"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Auditar historial y generar JSON sin valores de secretos
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          test -s "$GITLEAKS_CONFIG"
          report_dir="$RUNNER_TEMP/tp17-gitleaks-audit"
          mkdir -p "$report_dir"
          trap 'rm -f "$report_dir/raw.json" "$report_dir/scan.log"' EXIT
          # El código 1 también se usa en errores operativos de la CLI.
          # Reservamos 10 para findings y lo normalizamos a 1 informativo.
          if gitleaks git . --config "$GITLEAKS_CONFIG" --redact=100 \
            --log-opts=--all --exit-code=10 --no-banner \
            --report-format=json --report-path="$report_dir/raw.json" \
            > "$report_dir/scan.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          case "$status" in
            0) findings_status=0 ;;
            10) findings_status=1 ;;
            *)
              echo "::error::Gitleaks no completó la auditoría (código $status)."
              exit "$status"
              ;;
          esac
          export TP17_REPORT_DIR="$report_dir"
          export TP17_FINDINGS_STATUS="$findings_status"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["TP17_REPORT_DIR"])
          findings = json.loads((report_dir / "raw.json").read_text())
          if not isinstance(findings, list) or any(
              not isinstance(finding, dict) for finding in findings
          ):
              raise ValueError("Reporte Gitleaks inválido")
          status = int(os.environ["TP17_FINDINGS_STATUS"])
          if bool(findings) != bool(status):
              raise ValueError("Código de findings inconsistente con el reporte")
          # --redact oculta Secret, pero Message/Fragment pueden incluir texto.
          # Publicamos sólo ubicaciones/reglas; ningún texto de código o commit.
          fields = (
              "RuleID", "File", "StartLine", "EndLine", "StartColumn",
              "EndColumn", "Commit", "Fingerprint",
          )
          safe_findings = [
              {**{key: finding[key] for key in fields if key in finding},
               "Secret": "REDACTED"}
              for finding in findings
          ]
          (report_dir / "gitleaks-report.json").write_text(
              json.dumps(safe_findings, indent=2) + "\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  "### TP17 — Auditoría histórica Gitleaks\n\n"
                  f"Hallazgos no exceptuados: **{len(findings)}**.\n\n"
                  f"Código de hallazgos: **{status}** (informativo).\n"
                  "El Andon Gitleaks controla el bloqueo del deploy.\n"
              )
          print(f"Auditoría completada: {len(findings)} hallazgos no exceptuados.")
          PY
      - name: Publicar reporte Gitleaks redactado
        if: ${{ always() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tp17-gitleaks-audit-${{ github.sha }}
          path: ${{ runner.temp }}/tp17-gitleaks-audit/gitleaks-report.json
          retention-days: 14
          if-no-files-found: error

  deploy-k8s-helm:
    name: Fase 3 — Publicación y deploy Helm
    runs-on: ubuntu-24.04
    needs:
      - build-and-package
      - trivy-andon-cord
      - trivy-audit-report
      - gitleaks-andon-cord
      - gitleaks-audit-report
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.build-and-package.result == 'success' &&
          needs.trivy-andon-cord.result == 'success' &&
          needs.trivy-audit-report.result == 'success' &&
          needs.gitleaks-andon-cord.result == 'success' &&
          needs.gitleaks-audit-report.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
      - name: Restaurar imagen construida en Fase 1
        run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - name: Publicar imagen y desplegar si hay secretos/contexto
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Deploy omitido: configurar DOCKERHUB_USERNAME y DOCKERHUB_TOKEN en GitHub Actions Secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image="$DOCKERHUB_USERNAME/tp16-notes-backend"
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$image:$IMAGE_TAG"
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$image:$IMAGE_TAG"
          if [[ -z "$KUBECONFIG_B64" ]]; then
            echo "Imagen publicada; deploy omitido: falta KUBECONFIG_B64." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$POSTGRES_USER" || -z "$POSTGRES_PASSWORD" || -z "$POSTGRES_DB" ]]; then
            echo "Imagen publicada; deploy omitido: faltan POSTGRES_USER, POSTGRES_PASSWORD o POSTGRES_DB." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl create namespace devops-portfolio --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic tp16-postgres-credentials -n devops-portfolio \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install tp16 devops-tp12/chart \
            -n devops-portfolio -f devops-tp12/values-prod.yaml \
            --set-string backend.image.repository="$image" \
            --set-string backend.image.tag="$IMAGE_TAG" \
            --wait --timeout 5m
          echo "Imagen $image:$IMAGE_TAG publicada; Helm release aplicado." >> "$GITHUB_STEP_SUMMARY"
